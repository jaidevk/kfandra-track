name: CI

# Quality gate for every push to main and every pull request: lint, unit
# tests, and a production build must all pass. Deployment itself is handled
# natively by the Vercel GitHub App (push to main -> production, PRs -> preview)
# — this workflow is the gate that runs alongside it, not the deployer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        # Dynamic routes read Supabase env at request time, not at build, so
        # dummy values are enough to compile. Real secrets live in Vercel.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
          SESSION_SECRET: ci-dummy-session-secret-ci-dummy-session-secret
        run: npm run build
